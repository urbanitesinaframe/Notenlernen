<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Piano Trainer V0.3</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://unpkg.com/vexflow@4.2.3/build/cjs/vexflow.js"></script>

</head>

<body>

    <div class="container">

        <h1>Piano Trainer</h1>

        <p class="subtitle">
            Noten lesen, spielen und benennen
        </p>

        <div class="modeBox">

            <span class="modeLabel">
                Aktueller Modus:
            </span>

            <span id="modeDisplay">
                Töne spielen
            </span>

        </div>

        <div class="controls">

            <button id="modeBtn">
                Modus wechseln
            </button>

            <button id="startBtn">
                Test beginnen
            </button>

            <button id="stopBtn">
                Test beenden
            </button>

            <button id="newRowBtn">
                Neue Notenreihe
            </button>

        </div>

        <div class="timerBox">

            <div id="timerDisplay">
                Bereit
            </div>

        </div>

        <div id="notation"></div>

        <div id="status">
            Bereit
        </div>

        <div id="frequency">
            --
        </div>

        <!-- Nur im Benennungsmodus sichtbar -->

        <div id="nameModeControls">

            <input
                type="text"
                id="noteInput"
                autocomplete="off"
                placeholder="z.B. c, e, g, c1">

            <button id="submitBtn">
                Antwort prüfen
            </button>

        </div>

        <div class="results">

            <h2>Ergebnis</h2>

            <div id="resultContent">

                Noch keine Messung vorhanden.

            </div>

        </div>

        <div class="legend">

            <h3>Notation</h3>

            <ul>
                <li>
                    Großes C = Oktave unter c
                </li>

                <li>
                    c = erstes c
                </li>

                <li>
                    c1 = mittleres C
                </li>

                <li>
                    c2 = Oktave über c1
                </li>

                <li>
                    c3 = zwei Oktaven über c1
                </li>
            </ul>

        </div>

    </div>

    <script src="app.js"></script>

</body>

</html>
