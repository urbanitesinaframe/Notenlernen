<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Piano Trainer V0.2</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://unpkg.com/vexflow@4.2.3/build/cjs/vexflow.js"></script>

</head>

<body>

    <div class="container">

        <h1>Piano Trainer</h1>

        <p class="subtitle">
            Spiele die markierte Note auf dem Klavier.
        </p>

        <div class="controls">

            <button id="startBtn">
                Aufnahme beginnen
            </button>

            <button id="stopBtn">
                Aufnahme beenden
            </button>

            <button id="newRowBtn">
                Neue Notenreihe
            </button>

        </div>

        <div class="timerBox">

            <div class="timerLabel">
                Klicke auf <br>
                "Aufnahme beginnen", <br>um zu beginnen
            </div>

            <div id="timerDisplay">
                
            </div>

        </div>

        <div id="notation"></div>

        <div id="status">
            Bereit
        </div>

        <div id="frequency">
            --
        </div>

        <div class="results">

            <h2>Ergebnis</h2>

            <div id="resultContent">

                Noch keine Messung vorhanden.

            </div>

        </div>

    </div>

    <script src="app.js"></script>

</body>

</html>
